# Drafted with AI assistance (Codex).
name: CI and static deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt pytest
      - run: python -m compileall -q pipeline
      - name: Run pipeline tests
        run: |
          result=0
          python -m pytest pipeline || result=$?
          if [ "$result" -eq 5 ]; then
            echo "::notice::No pipeline tests collected yet."
          else
            exit "$result"
          fi

  app:
    name: App lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for the app scaffold
        run: |
          if [ ! -f app/package-lock.json ]; then
            echo "::error::The app scaffold and npm lockfile must be present to build or deploy."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run lint
          npm test --if-present
          npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: app-dist
          path: app/dist
          if-no-files-found: error

  azure:
    name: Deploy to Azure Static Web Apps
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [pipeline, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: app-dist
          path: app/dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app/dist
          output_location: ""
          skip_app_build: true

  fallback:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [pipeline, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: app-dist
          path: app/dist
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Publish the same static build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$PAGES_PROJECT" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_PROJECT as repository variables and CLOUDFLARE_API_TOKEN as a repository secret."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy app/dist --project-name="$PAGES_PROJECT" --branch=main
