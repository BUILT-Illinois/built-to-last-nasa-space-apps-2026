# Drafted with AI assistance (Codex).
name: CI and static deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt pytest
      - run: python -m compileall -q pipeline
      - name: Run pipeline tests
        run: |
          result=0
          python -m pytest pipeline || result=$?
          if [ "$result" -eq 5 ]; then
            echo "::notice::No pipeline tests collected yet."
          else
            exit "$result"
          fi

  app:
    name: App lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for the app scaffold
        run: |
          if [ ! -f app/package-lock.json ]; then
            echo "::error::The app scaffold and npm lockfile must be present to build or deploy."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run lint
          npm test --if-present
          npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: app-dist
          path: app/dist
          if-no-files-found: error

  api:
    name: API tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - working-directory: api
        run: |
          npm ci
          npm run build
          npm test
          npm prune --omit=dev
          tar -czf functions.tar.gz host.json package.json node_modules dist
      - uses: actions/upload-artifact@v6
        with:
          name: managed-api
          path: api/functions.tar.gz
          if-no-files-found: error

  azure:
    name: Deploy to Azure Static Web Apps
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [pipeline, app, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v7
        with:
          name: app-dist
          path: app/dist
      - uses: actions/download-artifact@v7
        with:
          name: managed-api
          path: api-package
      - run: tar -xzf api-package/functions.tar.gz -C api-package && rm api-package/functions.tar.gz
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app/dist
          output_location: ""
          skip_app_build: true
          api_location: api-package
          skip_api_build: true
      - name: Smoke test Azure
        run: node .github/scripts/deploy-smoke.mjs Azure https://yellow-desert-02401091e.4.azurestaticapps.net

  fallback:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [pipeline, app, api]
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$PAGES_PROJECT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare Pages is not configured. Skipping fallback deployment."
          fi
      - uses: actions/checkout@v6
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            functions
      - uses: actions/download-artifact@v7
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          name: app-dist
          path: app/dist
      - uses: actions/download-artifact@v7
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          name: managed-api
          path: api-package
      - name: Extract shared API data
        if: steps.cloudflare.outputs.configured == 'true'
        run: mkdir -p api && tar -xzf api-package/functions.tar.gz -C api dist/bundle.json
      - uses: actions/setup-node@v6
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          node-version: "24"
      - name: Publish the static build and Pages Functions
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --yes wrangler@4 pages deploy app/dist --project-name="$PAGES_PROJECT" --branch=main
      - name: Smoke test Cloudflare
        if: steps.cloudflare.outputs.configured == 'true'
        run: node .github/scripts/deploy-smoke.mjs Cloudflare https://built-to-last-6or.pages.dev
